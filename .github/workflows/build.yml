name: Build MacOptimizer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version || true
          xcrun swiftc --version

      - name: Build .app (DMG step failures are tolerated)
        run: |
          # build.sh 第 6/7 步会挂载 DMG 并驱动 Finder 排版，CI 上会失败；
          # 但 App 在第 5 步就已产出，所以用 alarm 兜底防挂起，失败也继续。
          perl -e 'alarm 1500; exec @ARGV' bash build.sh || true
          ls -la build || true
          find build -maxdepth 1 -name "*.app"

      - name: Package zip
        run: |
          APP=$(find build -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          echo "APP=$APP"
          ditto -c -k --keepParent "$APP" MacOptimizer.zip
          ls -lh MacOptimizer.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MacOptimizer-app
          path: MacOptimizer.zip
          retention-days: 14
